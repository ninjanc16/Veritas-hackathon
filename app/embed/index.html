<!doctype html>
<!--
  index.html - shows the portal on our own domain, filling the whole window.

  Why a wrapper: the portal is a Streamlit app, hosted at APP_URL. Streamlit Community Cloud does
  not allow our own domain, so this one small page (hosted for free on Vercel under our domain)
  simply shows the app in a full-window frame. There is ONE app and one set of pages.

  Links work as they do in the app itself: everything after the "?" is passed on, for example
      /?view=Budget%20planner        or        /?fips=48215&view=Canal%20action

  The folder "demo" next to this file holds the interactive map page (demo/index.html and
  demo/data.js, copied in when the site is deployed). The portal shows it on its
  "Interactive map" page, so it must be deployed here too.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rio Grande Drought and Canal Portal</title>
  <style>
    /* The app fills the whole window, with no margins or page scrollbar of our own. */
    html, body { margin: 0; height: 100%; background: #ffffff; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="app" title="Rio Grande Drought and Canal Portal" allow="clipboard-write"></iframe>

  <script>
    // The hosted app's address (no "?" part).
    var APP_URL = "https://hackathon-drought.streamlit.app";

    // Pass on whatever came after "?" (page, county, river) and add embed=true, which tells
    // Streamlit to hide its own page chrome because it is shown inside a frame.
    var params = new URLSearchParams(window.location.search);
    params.delete("tab");                 // an older version of this page used "tab"; ignore it
    params.set("embed", "true");
    // URLSearchParams writes spaces as "+"; use %20 so the link matches the app's own links.
    document.getElementById("app").src = APP_URL + "/?" + params.toString().replace(/\+/g, "%20");
  </script>
</body>
</html>
